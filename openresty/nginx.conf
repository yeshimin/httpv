worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";
  lua_shared_dict httpv_config 5m;
  lua_shared_dict httpv_pending 20m;
  lua_shared_dict httpv_metrics 1m;
  lua_check_client_abort on;
  resolver 127.0.0.11 ipv6=off valid=10s;

  init_by_lua_block {
    require("httpv.config").install_default()
  }

  init_worker_by_lua_block {
    require("httpv.publisher").start()
  }

  server {
    listen 8088;
    server_name _;

    location / {
      set $httpv_request_id "";

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;
      if ($request_method = OPTIONS) { return 204; }

      access_by_lua_block {
        require("httpv.flow").access()
      }
      header_filter_by_lua_block {
        require("httpv.flow").response_started()
      }
      log_by_lua_block {
        require("httpv.flow").response_finished()
      }

      proxy_pass http://demo:9000;
    }
  }

  # This listener is not published to the host. It is for the local prototype's
  # Go control service inside the Docker network only.
  server {
    listen 8091;
    server_name _;

    location = /internal/config {
      limit_except PUT { deny all; }
      content_by_lua_block {
        require("httpv.admin").put_config()
      }
    }

    location = /internal/metrics {
      content_by_lua_block {
        require("httpv.metrics").render()
      }
    }

    location = /internal/pending/decide-batch {
      limit_except POST { deny all; }
      content_by_lua_block {
        require("httpv.admin").decide_batch()
      }
    }

    location = /internal/pending/block-all {
      limit_except POST { deny all; }
      content_by_lua_block {
        require("httpv.admin").block_all_pending()
      }
    }

    location ~ ^/internal/pending/(?<httpv_pending_id>[A-Za-z0-9._-]+)$ {
      limit_except POST { deny all; }
      content_by_lua_block {
        require("httpv.admin").decide(ngx.var.httpv_pending_id)
      }
    }
  }
}
