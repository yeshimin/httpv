name: Feature request
description: Propose a scoped HTTPV improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the operator or integration problem rather than only a preferred implementation.}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Data-path and security impact, description: Explain failure mode, compatibility, sensitive-data handling, and expected overhead.}
    validations: {required: true}

