name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - name: Format
        run: test -z "$(gofmt -l control demo bench/loadgen)"
      - name: Test control
        working-directory: control
        run: go test -race ./...
      - name: Vet control
        working-directory: control
        run: go vet ./...
      - name: Test demo upstream
        working-directory: demo
        run: go test ./...
      - name: Build benchmark tool
        working-directory: bench/loadgen
        run: go test ./... && go build ./...

  rust:
    name: Rust edge agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        working-directory: edge-agent
        run: cargo +stable fmt --check
      - name: Test
        working-directory: edge-agent
        run: cargo +stable test --locked
      - name: Clippy
        working-directory: edge-agent
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  web:
    name: Vue production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.json config --quiet
      - run: docker compose -f compose.e2e.json config --quiet
      - env:
          HTTPV_ADMIN_TOKEN: ci-configuration-validation
        run: docker compose -f compose.production.json config --quiet
      - env:
          HTTPV_ADMIN_TOKEN: ci-configuration-validation
        run: docker compose -f compose.release.json config --quiet

  e2e:
    name: Browser and gateway E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: python -m pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: docker compose -f compose.e2e.json up --build -d
      - run: python -m pytest -q e2e/test_console.py
      - name: Capture container logs
        if: failure()
        run: docker compose -f compose.e2e.json logs --no-color > e2e-docker.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-docker-logs
          path: e2e-docker.log
      - name: Stop isolated stack
        if: always()
        run: docker compose -f compose.e2e.json down -v
